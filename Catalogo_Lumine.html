<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumine Semijoias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style id="css">
:root{--g:#1f3d2b;--o:#6b7a3a;--au:#b8935a;--bg:#fbf8f1;--card:#fff;--tx:#22301f;--mut:#6c7568;--ln:#e8e0cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#2f5a41;--bg:#101a14;--card:#17251c;--tx:#efe9da;--mut:#a3ad9f;--ln:#2a3a2f;color-scheme:dark}}
:root[data-theme="dark"]{--g:#2f5a41;--bg:#101a14;--card:#17251c;--tx:#efe9da;--mut:#a3ad9f;--ln:#2a3a2f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:300 16px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:var(--g);cursor:pointer;display:flex;gap:8px;align-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:var(--au)}}
nav{display:flex;gap:18px;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
nav a{cursor:pointer;color:var(--mut)}nav a:hover{color:var(--au)}
nav a.ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;color:var(--au)}nav a.ic:hover{border-color:var(--au)}
.star{color:var(--au)}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 30%,rgba(184,147,90,.18),transparent 60%),var(--bg);background-size:cover;background-position:center}
.cover.photo{color:#fff;background-blend-mode:normal}
.cover h1{font-size:clamp(46px,10vw,88px);color:var(--g);animation:rise 1.2s both}
.cover.photo h1,.cover.photo .slg{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover h1{color:var(--au)}}
.cover .sub{letter-spacing:.5em;text-transform:uppercase;font-size:13px;color:var(--mut);margin-top:4px}
.slg{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:24px;margin:22px 0 34px;color:var(--o)}
.cover svg{width:64px;height:64px;animation:glow 3.5s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{50%{opacity:.55;transform:scale(.94)}}
.btn{background:var(--g);color:#fff;border:0;padding:12px 30px;letter-spacing:.14em;text-transform:uppercase;font-size:13px;cursor:pointer;transition:.3s}
.btn:hover{background:var(--au)}
.btn.ghost{background:none;color:var(--g);border:1px solid var(--au)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--au)}}
.btn.sm{padding:6px 14px;font-size:12px}
.btn.danger{background:#8a2f2f}
section{padding:56px 0}
.t{text-align:center;margin-bottom:30px}.t h2{font-size:36px;color:var(--g)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t h2{color:var(--au)}}
.t:after{content:"✦";display:block;color:var(--au);font-size:14px;margin-top:6px}
.cats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1px solid var(--ln);background:var(--card);padding:8px 18px;border-radius:99px;cursor:pointer;font-size:14px;transition:.3s}
.chip:hover,.chip.on{border-color:var(--au);color:var(--au)}
.cats.sc{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}.cats.sc::-webkit-scrollbar{display:none}.cats.sc .chip{flex:0 0 auto;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--ln);cursor:pointer;transition:.4s;overflow:hidden}
.card:hover{box-shadow:0 10px 30px rgba(31,61,43,.12);transform:translateY(-3px)}
.ph{aspect-ratio:1;background:linear-gradient(135deg,var(--bg),var(--ln));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:.6s}.card:hover .ph img{transform:scale(1.05)}
.ph svg{width:40px;opacity:.5}
.card .in{padding:14px 16px}.card h3{font-size:20px}.cod{font-size:12px;color:var(--mut);letter-spacing:.1em}
.pr{color:var(--au);font-weight:500;margin-top:4px}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--o)}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
input,select,textarea{background:var(--card);border:1px solid var(--ln);padding:10px 12px;width:100%;border-radius:2px}
.bar input{flex:1;min-width:200px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.info div{background:var(--card);border:1px solid var(--ln);padding:24px}.info h3{color:var(--au);margin-bottom:8px;font-size:22px}
footer{text-align:center;padding:36px 20px;color:var(--mut);font-size:13px;border-top:1px solid var(--ln)}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.7);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--bg);max-width:860px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
@media (max-width:700px){.box{grid-template-columns:1fr}}
.box .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(251,248,241,.9);color:#22301f;border:0;font-size:26px;line-height:1;padding:0 0 3px;cursor:pointer;z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.big{aspect-ratio:1;background:var(--ln);display:flex;align-items:center;justify-content:center}.big img{width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:6px;padding:6px;overflow-x:auto}.th img{width:56px;height:56px;object-fit:cover;cursor:pointer;opacity:.7}.th img:hover{opacity:1}
.det{padding:26px}.det h2{font-size:32px;color:var(--g)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .det h2{color:var(--au)}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;background:#25d366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);text-decoration:none;font-size:26px}
.adm table{width:100%;border-collapse:collapse;font-size:14px}.adm td,.adm th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
.tw{overflow-x:auto}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fm .f{grid-column:1/-1}
@media (max-width:600px){.fm{grid-template-columns:1fr}}
label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:3px}
.pth{display:flex;gap:8px;flex-wrap:wrap}.pth div{position:relative}.pth img{width:70px;height:70px;object-fit:cover}.pth b{position:absolute;top:0;right:0;background:#8a2f2f;color:#fff;cursor:pointer;padding:0 5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--g);color:#fff;padding:10px 20px;z-index:30;display:none}
.pc{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0e2417;cursor:pointer;overflow:hidden}
.pc .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(28px) brightness(.55);transform:scale(1.15)}
.pw{position:relative;height:100%;max-width:100%;aspect-ratio:1152/2048}
.pw img{width:100%;height:100%;display:block;object-fit:contain}
.hs{position:absolute;left:21%;width:58%;top:82.5%;height:6.5%;border-radius:99px;transition:.4s}
.pc:hover .hs,.pc:focus-visible .hs{box-shadow:0 0 28px rgba(212,175,110,.65),inset 0 0 0 2px rgba(255,236,190,.7)}
.pc:focus{outline:none}
@media (max-aspect-ratio:7/10){.pw{width:100%;height:100%;aspect-ratio:auto}.pw img{object-fit:cover}.hs,.pc .bgi{display:none}}
</style>
</head>

<script id="app">
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAW=JSON.parse($('#data').textContent);
const DEF=['Colares e correntes','Brincos','Piercings','Pulseiras','Braceletes','Anéis','Tornozeleiras','Prata 925','Masculino','Infantil'];
const S={st:Object.assign({slogan:'Acenda sua luz.',whatsapp:'',intro:'Semijoias pensadas para iluminar o seu jeito de brilhar.',cover:'',green:'',gold:'',pay:'Pix, cartão de crédito e débito. Consulte parcelamento pelo WhatsApp.',care:'Evite contato com perfumes, cremes e água do mar. Guarde cada peça separada, em local seco, e limpe com flanela macia.',about:'Cada peça tem código próprio e disponibilidade atualizada. Fale conosco para tirar dúvidas sobre medidas e materiais.'},RAW.st||{}),
cats:(RAW.cats&&RAW.cats.length)?RAW.cats:DEF.map((n,i)=>({id:'c'+i,name:n})),prods:RAW.prods||[]};
const FP=String($('#data').textContent.length);
try{const sv=JSON.parse(localStorage.getItem('lumine-catalogo')||'null');if(sv&&sv.base===FP&&sv.prods){Object.assign(S.st,sv.st||{});if(sv.cats&&sv.cats.length)S.cats=sv.cats;S.prods=sv.prods}}catch(e){}
let V='cover',cat='',q='',owner=false,edit=null,uk=null;
const STAR='<svg viewBox="0 0 24 24" fill="currentColor" class="star"><path d="M12 1l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/></svg>';
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
function theme(){const r=document.documentElement.style;if(S.st.green)r.setProperty('--g',S.st.green);if(S.st.gold)r.setProperty('--au',S.st.gold)}
const vis=()=>S.prods.filter(p=>p.active!==false);
const avail=p=>Number(p.stock)>0?'Disponível':'Indisponível';
function card(p){return `<div class="card" onclick="openP('${p.id}')"><div class="ph">${p.photos&&p.photos[0]?`<img loading="lazy" src="${esc(p.photos[0])}" alt="${esc(p.name)}">`:STAR}</div><div class="in">${p.isNew?'<div class="tag">Novidade</div>':''}<h3>${esc(p.name)}</h3><div class="cod">${esc(p.code)}</div><div class="pr">${brl(p.price)}</div></div></div>`}
function head(){return `<header><div class="wrap"><div class="logo" onclick="cat='';go('shop')">${STAR.replace('<svg','<svg width="16" height="16"')}Lumine</div><nav><a class="ic" title="Catálogo" aria-label="Catálogo" onclick="cat='';go('shop')">${STAR.replace('<svg','<svg width="20" height="20"')}</a><a class="ic" title="Garantia" aria-label="Garantia" onclick="go('info')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></a>${owner?'<a onclick="go(\'admin\')">Painel</a><a onclick="shareCat()">Compartilhar</a>':''}</nav></div></header>`}
function wa(msg){const n=(S.st.whatsapp||'').replace(/\D/g,'');return n?`https://wa.me/${n}?text=${encodeURIComponent(msg)}`:''}
function shell(b){return head()+b+`<footer>Lumine Semijoias · ${esc(S.st.slogan)}</footer>`+(wa('Olá! Vim pelo catálogo da Lumine.')?`<a class="wa" href="${wa('Olá! Vim pelo catálogo da Lumine.')}" target="_blank" rel="noopener" aria-label="WhatsApp">✆</a>`:'')}
function catsHtml(){return `<div class="cats">${S.cats.map(c=>`<span class="chip" onclick="cat='${c.id}';go('shop')">${esc(c.name)}</span>`).join('')}</div>`}
function render(){
 theme();const r=$('#root');
 if(V==='cover'&&S.st.poster){r.innerHTML=`<div class="pc" role="button" tabindex="0" aria-label="Acessar catálogo" onclick="cat='';go('shop')" onkeydown="if(event.key==='Enter'||event.key===' '){cat='';go('shop')}"><img class="bgi" src="${S.st.poster}" alt=""><div class="pw"><img src="${S.st.poster}" alt="Lumine Semijoias — Acenda sua luz"><span class="hs"></span></div></div>`;return}
 if(V==='cover'){const c=S.st.cover;r.innerHTML=`<div class="cover${c?' photo':''}" ${c?`style="background-image:linear-gradient(rgba(20,40,28,.55),rgba(20,40,28,.55)),url('${esc(c)}')"`:''}>${STAR.replace('<svg','<svg style="color:var(--au)"')}<h1>Lumine</h1><div class="sub">Semijoias</div><div class="slg">${esc(S.st.slogan)}</div><button class="btn" onclick="cat='';go('shop')">Ver catálogo</button></div>`;return}
 if(V==='home'){const f=vis().filter(p=>p.featured),n=vis().filter(p=>p.isNew);
  r.innerHTML=shell(`<section><div class="wrap"><div class="t"><h2>Bem-vinda à Lumine</h2></div><p style="text-align:center;max-width:560px;margin:0 auto">${esc(S.st.intro)}</p></div></section>
  ${f.length?`<section><div class="wrap"><div class="t"><h2>Destaques</h2></div><div class="grid">${f.map(card).join('')}</div></div></section>`:''}
  ${n.length?`<section><div class="wrap"><div class="t"><h2>Novidades</h2></div><div class="grid">${n.map(card).join('')}</div></div></section>`:''}
  <section><div class="wrap"><div class="t"><h2>Categorias</h2></div>${catsHtml()}<div class="row" style="justify-content:center;margin-top:30px"><button class="btn ghost" onclick="cat='';go('shop')">Ver todas as peças</button></div></div></section>`);return}
 if(V==='shop'){const l=list();r.innerHTML=shell(`<section><div class="wrap"><div class="t"><h2>Catálogo</h2></div><div class="bar"><input id="qs" placeholder="Buscar por nome ou código" value="${esc(q)}" oninput="q=this.value;grid()"></div><div class="cats sc" style="margin-bottom:24px"><span class="chip${cat?'':' on'}" onclick="cat='';render()">Todas</span>${S.cats.map(c=>`<span class="chip${c.id===cat?' on':''}" onclick="cat='${c.id}';render()">${esc(c.name)}</span>`).join('')}</div><div id="gr"></div></div></section>`);grid();(document.querySelector('.cats.sc .on')||{scrollIntoView(){}}).scrollIntoView({inline:'center',block:'nearest'});return}
 if(V==='info'){r.innerHTML=shell(`<section><div class="wrap"><div class="t"><h2>Garantia e informações</h2></div><div class="info"><div><h3>1 ano de garantia</h3><p>Todas as peças da Lumine têm 1 ano de garantia.</p></div><div><h3>Cuidados</h3><p>${esc(S.st.care)}</p></div><div><h3>Pagamento</h3><p>${esc(S.st.pay)}</p></div><div><h3>Sobre as peças</h3><p>${esc(S.st.about)}</p></div></div></div></section>`);return}
 if(V==='admin'&&owner){adminView();return}
}
function list(){const t=q.trim().toLowerCase();return vis().filter(p=>(!cat||p.cat===cat)&&(!t||(p.name+' '+p.code).toLowerCase().includes(t)))}
function grid(){const l=list();$('#gr').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${S.prods.length?(cat&&!q.trim()?'Em breve, novas peças nesta categoria.':'Nenhuma peça encontrada.'):'O catálogo está sendo preparado. Em breve, novas peças.'}</div>`}
function go(v){V=v;if(v!=='shop'&&v!=='home'){}window.scrollTo(0,0);try{sessionStorage.setItem('lv',v)}catch(e){}render()}
function cm(m){m.remove();if(m._h){m._h=0;try{history.back()}catch(e){}}}
addEventListener('popstate',()=>{const m=[...document.querySelectorAll('.modal')].pop();if(m&&m._h){m._h=0;m.remove()}});
function openP(id){const p=S.prods.find(x=>x.id===id);if(!p)return;const cn=(S.cats.find(c=>c.id===p.cat)||{}).name||'';const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)cm(m)};
 const ph=p.photos||[];const link=wa(`Olá! Tenho interesse na peça ${p.name} (código ${p.code}).`);
 m.innerHTML=`<div class="box"><button class="x" aria-label="Fechar">×</button><div><div class="big">${ph[0]?`<img id="bg" src="${esc(ph[0])}" alt="${esc(p.name)}">`:STAR}</div>${ph.length>1?`<div class="th">${ph.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}</div><div class="det"><div class="tag">${esc(cn)}</div><h2>${esc(p.name)}</h2><div class="cod">Código ${esc(p.code)}</div><div class="pr" style="font-size:22px;margin:8px 0">${brl(p.price)}</div><p>${esc(p.desc)}</p><p><b>Material:</b> ${esc(p.material)}</p><p><b>${avail(p)}</b></p><div class="row">${link?`<a class="btn" style="text-decoration:none" href="${link}" target="_blank" rel="noopener">Comprar pelo WhatsApp</a>`:''}<button class="btn ghost" id="sh">Compartilhar</button></div></div></div>`;
 document.body.appendChild(m);try{history.pushState({m:1},'');m._h=1}catch(e){}m.querySelector('.x').onclick=()=>cm(m);
 m.querySelectorAll('.th img').forEach(i=>i.onclick=()=>{$('#bg').src=i.src});
 m.querySelector('#sh').onclick=async()=>{const txt=`${p.name} · ${p.code} · ${brl(p.price)} — Lumine Semijoias`;try{if(navigator.share)await navigator.share({title:p.name,text:txt});else{await navigator.clipboard.writeText(txt);toast('Texto copiado')}}catch(e){}}}
/* ---------- painel ---------- */
function adminView(){
 const r=$('#root');const rows=S.prods.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${brl(p.price)}</td><td>${p.stock}</td><td>${p.active===false?'Inativo':'Ativo'}</td><td style="white-space:nowrap"><button class="btn sm ghost" onclick="tg('${p.id}')">${p.active===false?'Ativar':'Desativar'}</button> <button class="btn sm" onclick="ed('${p.id}')">Editar</button> <button class="btn sm danger" onclick="del('${p.id}')">Excluir</button></td></tr>`).join('');
 const st=S.st;
 r.innerHTML=head()+`<section class="adm"><div class="wrap"><div class="t"><h2>Painel da Lumine</h2></div>
 <div class="row" style="margin:0 0 18px"><button class="btn" onclick="ed()">+ Novo produto</button> <button class="btn ghost" onclick="shareCat()">Compartilhar catálogo</button> <button class="btn ghost" onclick="dl()">Baixar HTML atualizado</button></div>
 <div class="tw"><table><tr><th>Código</th><th>Nome</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan="6" class="empty">Nenhum produto cadastrado ainda.</td></tr>'}</table></div>
 <div class="t" style="margin-top:50px"><h2>Categorias</h2></div>
 <div class="fm">${S.cats.map(c=>`<div class="f" style="display:flex;gap:8px"><input value="${esc(c.name)}" onchange="rc('${c.id}',this.value)"><button class="btn sm danger" onclick="dc('${c.id}')">Remover</button></div>`).join('')}<div class="f" style="display:flex;gap:8px"><input id="nc" placeholder="Nova categoria"><button class="btn sm" onclick="ac()">Adicionar</button></div></div>
 <div class="t" style="margin-top:50px"><h2>Dados da loja</h2></div>
 <div class="fm"><div><label>WhatsApp (com DDD, só números)</label><input id="s_whatsapp" value="${esc(st.whatsapp)}" placeholder="5511999999999"></div><div><label>Slogan</label><input id="s_slogan" value="${esc(st.slogan)}"></div>
 <div><label>Cor principal (verde)</label><input id="s_green" type="color" value="${st.green||'#1f3d2b'}"></div><div><label>Cor dourada</label><input id="s_gold" type="color" value="${st.gold||'#b8935a'}"></div>
 <div class="f"><label>Apresentação (página inicial)</label><textarea id="s_intro" rows="2">${esc(st.intro)}</textarea></div>
 <div class="f"><label>Cuidados</label><textarea id="s_care" rows="2">${esc(st.care)}</textarea></div>
 <div class="f"><label>Formas de pagamento</label><textarea id="s_pay" rows="2">${esc(st.pay)}</textarea></div>
 <div class="f"><label>Informações sobre as peças</label><textarea id="s_about" rows="2">${esc(st.about)}</textarea></div>
 <div class="f"><label>Foto da capa</label><div class="pth">${st.cover?`<div><img src="${esc(st.cover)}" alt=""><b onclick="S.st.cover='';adminView()">×</b></div>`:''}</div><input type="file" accept="image/*" onchange="up(this.files,u=>{S.st.cover=u[0];adminView()})"></div></div>
 <div class="row"><button class="btn" onclick="ss()">Salvar dados da loja</button></div></div></section>`}
function ed(id){const p=id?S.prods.find(x=>x.id===id):{id:'p'+Date.now(),name:'',code:'',cat:S.cats[0]?.id||'',desc:'',material:'',price:'',stock:1,photos:[],isNew:false,featured:false,active:true};edit=JSON.parse(JSON.stringify(p));form()}
function form(){const p=edit;const m=document.createElement('div');m.className='modal';m.id='fm';
 m.innerHTML=`<div class="box" style="display:block;padding:24px"><button class="x" onclick="$('#fm').remove()">×</button><h2 style="margin-bottom:14px">${S.prods.some(x=>x.id===p.id)?'Editar produto':'Novo produto'}</h2><div class="fm">
 <div><label>Nome</label><input id="f_name" value="${esc(p.name)}"></div><div><label>Código</label><input id="f_code" value="${esc(p.code)}"></div>
 <div><label>Categoria</label><select id="f_cat">${S.cats.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label>Material</label><input id="f_material" value="${esc(p.material)}"></div>
 <div><label>Preço (R$)</label><input id="f_price" type="number" step="0.01" value="${p.price}"></div><div><label>Estoque</label><input id="f_stock" type="number" value="${p.stock}"></div>
 <div class="f"><label>Descrição</label><textarea id="f_desc" rows="3">${esc(p.desc)}</textarea></div>
 <div class="f"><label>Fotos</label><div class="pth" id="f_ph">${ph(p)}</div><input id="f_file" type="file" accept="image/*" multiple hidden onchange="up(this.files,u=>{edit.photos.push(...u);$('#f_ph').innerHTML=ph(edit)});setTimeout(()=>{this.value=''},0)"><button type="button" class="btn ghost sm" onclick="$('#f_file').click()">+ Adicionar fotos da galeria</button></div>
 <div><label><input type="checkbox" id="f_new" ${p.isNew?'checked':''} style="width:auto"> Novidade</label></div><div><label><input type="checkbox" id="f_feat" ${p.featured?'checked':''} style="width:auto"> Destaque na home</label></div>
 <div><label><input type="checkbox" id="f_act" ${p.active!==false?'checked':''} style="width:auto"> Produto ativo</label></div></div>
 <div class="row"><button class="btn" onclick="sp()">Salvar produto</button></div></div>`;document.body.appendChild(m)}
const ph=p=>p.photos.map((u,i)=>`<div><img src="${esc(u)}" alt=""><b onclick="edit.photos.splice(${i},1);$('#f_ph').innerHTML=ph(edit)">×</b></div>`).join('');
function shrink(f,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};i.onerror=()=>no();i.src=u})}
async function up(files,cb,max=720){files=[...files];if(!files.length)return;toast('Preparando fotos…');const out=[];for(const f of files){try{out.push(await shrink(f,max))}catch(e){toast('Não consegui abrir uma das fotos')}}cb(out);if(out.length)toast(out.length+' foto(s) adicionada(s). Toque em Salvar produto.')}
function sp(){const p=edit;p.name=$('#f_name').value.trim();p.code=$('#f_code').value.trim();if(!p.name||!p.code)return toast('Informe nome e código');
 if(S.prods.some(x=>x.id!==p.id&&x.code===p.code))return toast('Esse código já existe');
 Object.assign(p,{cat:$('#f_cat').value,material:$('#f_material').value,price:parseFloat($('#f_price').value)||0,stock:parseInt($('#f_stock').value)||0,desc:$('#f_desc').value,isNew:$('#f_new').checked,featured:$('#f_feat').checked,active:$('#f_act').checked});
 const i=S.prods.findIndex(x=>x.id===p.id);if(i<0)S.prods.push(p);else S.prods[i]=p;commit()}
function tg(id){const p=S.prods.find(x=>x.id===id);p.active=p.active===false;commit()}
function del(id){if(confirm('Excluir este produto de vez? Para só esconder, use Desativar.')){S.prods=S.prods.filter(x=>x.id!==id);commit()}}
function rc(id,n){S.cats.find(c=>c.id===id).name=n.trim()||'Sem nome';commit()}
function dc(id){if(S.prods.some(p=>p.cat===id))return toast('Mude os produtos dessa categoria antes de remover');S.cats=S.cats.filter(c=>c.id!==id);commit()}
function ac(){const n=$('#nc').value.trim();if(!n)return;S.cats.push({id:'c'+Date.now(),name:n});commit()}
function ss(){for(const k of ['whatsapp','slogan','green','gold','intro','care','pay','about'])S.st[k]=$('#s_'+k).value;commit()}
async function shareCat(){const url=location.href.split('#')[0];try{if(navigator.share){await navigator.share({title:'Lumine Semijoias',text:'Conheça o catálogo da Lumine Semijoias ✦',url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(url);toast('Link do catálogo copiado')}catch(e){prompt('Copie o link do catálogo:',url)}}
function build(){const d=JSON.stringify({st:S.st,cats:S.cats,prods:S.prods}).replace(/</g,'\\u003c');
 return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Lumine Semijoias</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">\n<style id="css">'+$('#css').textContent+'</style>\n</head>\n<body>\n<div id="root"></div>\n<div id="toast"></div>\n<script id="data" type="application/json">'+d+'<\/script>\n<script id="app">'+$('#app').textContent+'<\/script>\n</body>\n</html>'}
async function commit(){try{localStorage.setItem('lumine-catalogo',JSON.stringify({base:FP,st:S.st,cats:S.cats,prods:S.prods}));toast('Salvo')}catch(e){toast('Não foi possível salvar')}render()}
function dl(){const b=new Blob([build()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='catalogo-lumine.html';document.body.appendChild(a);a.click();a.remove()}
(async()=>{owner=location.hash==='#admin';
 let lv='cover';try{lv=sessionStorage.getItem('lv')||'cover'}catch(e){}
 V=(lv==='home'||(lv==='admin'&&!owner))?'shop':lv;render()})();
</script>
</body>
</html>
